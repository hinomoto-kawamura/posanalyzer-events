.toolbar{display:grid;grid-template-columns:1fr 220px;gap:10px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.label{color:var(--muted);font-size:12px}.value{font-size:22px;font-weight:800}.day{margin:18px 0 24px}.day-title{font-size:18px;font-weight:800;margin-bottom:10px}
.weekday{color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(315px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.name{font-size:17px;font-weight:800;margin-bottom:8px}
.meta{display:grid;grid-template-columns:86px 1fr;gap:5px 8px;font-size:14px}.k{color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge{font-size:12px;background:var(--soft);color:#1d4ed8;padding:4px 8px;border-radius:999px}
.source{margin-top:10px;font-size:12px}.source a{color:var(--accent);text-decoration:none}.empty{padding:44px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
@media(max-width:720px){.header h1{font-size:20px}.date-nav{grid-template-columns:1fr 1fr 1fr}.date-nav input{grid-column:1/-1}.toolbar{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.cards{grid-template-columns:1fr}main{padding:12px}}

const DATA_START="2025-04-01";
const DATA_END="2027-05-27";
const today=new Date();today.setHours(0,0,0,0);
let selectedDate=new Date(today);
let activeRange="date";
const targetDate=document.getElementById("targetDate");
const prevDay=document.getElementById("prevDay");
const todayButton=document.getElementById("todayButton");
const nextDay=document.getElementById("nextDay");
const search=document.getElementById("search");
const venue=document.getElementById("venue");
const filters=document.getElementById("filters");
const content=document.getElementById("content");

function dateOnly(v){var d=new Date(v+"T00:00:00");d.setHours(0,0,0,0);return d}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function clampDate(d){
 var min=dateOnly(DATA_START),max=dateOnly(DATA_END);
 if(d<min)return min;if(d>max)return max;return d
}
function bounds(){
 var start=clampDate(selectedDate);
 if(activeRange==="date")return[start,start];
 if(activeRange==="week")return[start,clampDate(addDays(start,6))];
 if(activeRange==="30")return[start,clampDate(addDays(start,29))];
 return[dateOnly(DATA_START),dateOnly(DATA_END)]
}
function setSelectedDate(d){
 selectedDate=clampDate(d);
 targetDate.value=ymd(selectedDate);
 activeRange="date";
 filters.querySelectorAll("button").forEach(function(x){x.classList.toggle("active",x.dataset.range==="date")});
 render()
}
function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function wd(d){return["日","月","火","水","木","金","土"][d.getDay()]}
function md(v){var d=dateOnly(v);return(d.getMonth()+1)+"/"+d.getDate()}
function tm(a,b){if(a&&b)return a+" ～ "+b;if(a)return a;return"時間未定"}
function buildVenues(){
 [...new Set(EVENTS.map(function(x){return x.Venue}).filter(Boolean))].sort(function(a,b){return a.localeCompare(b,"ja")}).forEach(function(v){
  var o=document.createElement("option");o.value=v;o.textContent=v;venue.appendChild(o)
 })
}
function getRows(){
 var b=bounds(),q=search.value.trim().toLowerCase(),v=venue.value;
 return EVENTS.filter(function(x){
  var d=dateOnly(x.Date);if(d<b[0]||d>b[1])return false;if(v&&x.Venue!==v)return false;if(!q)return true;
  return (x.Name+" "+x.Venue+" "+x.Type+" "+x.Note).toLowerCase().includes(q)
 }).sort(function(a,b){var d=a.Date.localeCompare(b.Date);return d!==0?d:(a.Start||"99:99").localeCompare(b.Start||"99:99")})
}
function render(){
 var rows=getRows(),b=bounds();
 document.getElementById("eventCount").textContent=rows.length.toLocaleString("ja-JP")+"件";
 document.getElementById("attendanceTotal").textContent=rows.reduce(function(a,x){return a+(x.Attendance||0)},0).toLocaleString("ja-JP")+"人";
 document.getElementById("rangeLabel").textContent=md(ymd(b[0]))+" ～ "+md(ymd(b[1]));
 if(!rows.length){content.innerHTML='<div class="empty">該当するイベントはありません。</div>';return}
 var groups={};rows.forEach(function(x){(groups[x.Date]||(groups[x.Date]=[])).push(x)});
 var html="";
 Object.keys(groups).forEach(function(date){
  var d=dateOnly(date);html+='<section class="day"><div class="day-title">'+md(date)+' <span class="weekday">（'+wd(d)+'）</span></div><div class="cards">';
  groups[date].forEach(function(x){
   var link=x.SourceUrl&&/^https?:\/\//i.test(x.SourceUrl)?'<a href="'+esc(x.SourceUrl)+'" target="_blank" rel="noopener">情報元を開く</a>':esc(x.Source||"");
   html+='<article class="card"><div class="name">'+esc(x.Name)+'</div><div class="meta">';
   html+='<div class="k">会場</div><div>'+esc(x.Venue)+'</div><div class="k">時間</div><div>'+esc(tm(x.Start,x.End))+'</div>';
   html+='<div class="k">想定人数</div><div><strong>'+Number(x.Attendance||0).toLocaleString("ja-JP")+'人</strong></div></div><div class="badges">';
   if(x.Type)html+='<span class="badge">'+esc(x.Type)+'</span>';if(x.Scale)html+='<span class="badge">規模：'+esc(x.Scale)+'</span>';
   if(x.OutOfPrefecture>0)html+='<span class="badge">県外 '+Number(x.OutOfPrefecture).toLocaleString("ja-JP")+'人</span>';
   if(x.Overseas>0)html+='<span class="badge">海外 '+Number(x.Overseas).toLocaleString("ja-JP")+'人</span>';
   html+='</div>';if(x.Note)html+='<div class="source">'+esc(x.Note)+'</div>';html+='<div class="source">'+link+'</div></article>'
  });html+='</div></section>'
 });content.innerHTML=html
}
filters.addEventListener("click",function(e){
 var b=e.target.closest("button[data-range]");if(!b)return;
 activeRange=b.dataset.range;
 filters.querySelectorAll("button").forEach(function(x){x.classList.remove("active")});
 b.classList.add("active");
 render()
});
targetDate.addEventListener("change",function(){
 if(!targetDate.value)return;
 setSelectedDate(dateOnly(targetDate.value))
});
prevDay.addEventListener("click",function(){setSelectedDate(addDays(selectedDate,-1))});
todayButton.addEventListener("click",function(){setSelectedDate(today)});
nextDay.addEventListener("click",function(){setSelectedDate(addDays(selectedDate,1))});
search.addEventListener("input",render);
venue.addEventListener("change",render);
targetDate.value=ymd(selectedDate);
buildVenues();
render();
</script>
